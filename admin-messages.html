<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration des messages - DIAWLAL</title>

    <style>
        :root {
            --or: #d4af37;
            --or-clair: #f4d76b;
            --or-fonce: #9d7515;
            --gris: #b8b8b8;
            --vert: #22c55e;
            --rouge: #ef4444;
            --bordure: rgba(212, 175, 55, 0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(212, 175, 55, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080808,
                    #111111,
                    #181818
                );

            background-attachment: fixed;
        }

        nav {
            width: min(1200px, 94%);
            margin: auto;
            padding: 22px 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            border-bottom:
                1px solid rgba(212, 175, 55, 0.18);
        }

        .logo {
            color: var(--or);

            font-size: 29px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .menu {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 7px;
        }

        .menu a,
        .deconnexion {
            padding: 10px 12px;

            color: white;
            background: transparent;

            border: none;
            border-radius: 9px;

            text-decoration: none;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        .menu a:hover,
        .deconnexion:hover {
            color: var(--or-clair);
            background: rgba(212, 175, 55, 0.10);
        }

        .container {
            width: min(1100px, 92%);
            margin: auto;
            padding: 50px 0 80px;
        }

        .entete {
            margin-bottom: 30px;
            text-align: center;
        }

        .entete h1 {
            margin-bottom: 12px;

            font-size: clamp(36px, 6vw, 58px);
        }

        .entete p {
            color: var(--gris);
            font-size: 18px;
        }

        .statistiques {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 16px;
            margin-bottom: 24px;
        }

        .stat {
            padding: 22px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #101010
                );

            border: 1px solid var(--bordure);
            border-radius: 16px;
        }

        .stat span {
            display: block;

            margin-bottom: 8px;

            color: var(--gris);
            font-size: 14px;
        }

        .stat strong {
            color: var(--or-clair);
            font-size: 29px;
        }

        .outils {
            margin-bottom: 25px;
            padding: 20px;

            display: grid;
            grid-template-columns:
                1fr 220px auto;

            gap: 12px;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #101010
                );

            border: 1px solid var(--bordure);
            border-radius: 16px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            color: white;
            background: #0d0d0d;

            border:
                1px solid rgba(212, 175, 55, 0.35);

            border-radius: 10px;

            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--or);
        }

        select option {
            color: white;
            background: #111111;
        }

        .actualiser {
            padding: 13px 18px;

            color: #111111;

            background:
                linear-gradient(
                    135deg,
                    var(--or-clair),
                    var(--or),
                    var(--or-fonce)
                );

            border: none;
            border-radius: 10px;

            font-weight: 900;
            cursor: pointer;
        }

        .liste {
            display: grid;
            gap: 18px;
        }

        .message {
            position: relative;

            padding: 24px;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #101010
                );

            border: 1px solid var(--bordure);
            border-radius: 18px;

            transition: 0.25s;
        }

        .message.non-lu {
            border-color: var(--or-clair);

            box-shadow:
                0 0 0 2px rgba(212, 175, 55, 0.08);
        }

        .message.lu {
            opacity: 0.78;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;

            margin-bottom: 15px;
        }

        .message h2 {
            margin-bottom: 6px;

            color: var(--or-clair);
            font-size: 23px;
        }

        .email {
            color: var(--gris);
            font-size: 14px;
        }

        .date {
            color: var(--gris);
            font-size: 13px;
            white-space: nowrap;
        }

        .badge {
            display: inline-block;

            margin-top: 10px;
            padding: 5px 9px;

            border-radius: 999px;

            font-size: 12px;
            font-weight: 900;
        }

        .badge-non-lu {
            color: #111111;
            background: var(--or-clair);
        }

        .badge-lu {
            color: #bbf7d0;
            background: rgba(34, 197, 94, 0.18);

            border:
                1px solid rgba(34, 197, 94, 0.35);
        }

        .sujet {
            margin-bottom: 12px;

            color: white;
            font-weight: 900;
        }

        .contenu {
            margin-bottom: 20px;

            color: #dedede;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .actions {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 10px;
        }

        .bouton {
            padding: 12px;

            border: none;
            border-radius: 9px;

            font-weight: 900;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }

        .bouton-lire {
            color: #111111;

            background:
                linear-gradient(
                    135deg,
                    var(--or-clair),
                    var(--or)
                );
        }

        .bouton-repondre {
            color: white;
            background: #166534;
        }

        .bouton-supprimer {
            color: white;
            background: #991b1b;
        }

        .bouton:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .vide,
        .chargement,
        .erreur {
            padding: 32px;

            text-align: center;
            color: var(--gris);

            border:
                1px dashed rgba(212, 175, 55, 0.35);

            border-radius: 16px;
        }

        .erreur {
            color: #fecaca;

            border-color:
                rgba(239, 68, 68, 0.45);
        }

        @media (max-width: 800px) {
            nav {
                flex-direction: column;
            }

            .statistiques {
                grid-template-columns: 1fr;
            }

            .outils {
                grid-template-columns: 1fr;
            }

            .message-header {
                flex-direction: column;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            DIAWLAL ADMIN
        </div>

        <div class="menu">

            <a href="dashboard.html">
                Tableau de bord
            </a>

            <a href="index.html">
                Accueil
            </a>

            <button
                class="deconnexion"
                onclick="seDeconnecter()"
            >
                Déconnexion
            </button>

        </div>

    </nav>


    <main class="container">

        <section class="entete">

            <h1>
                Messages reçus
            </h1>

            <p>
                Consultez et gérez les messages envoyés à DIAWLAL.
            </p>

        </section>


        <section class="statistiques">

            <article class="stat">

                <span>
                    Total
                </span>

                <strong id="totalMessages">
                    0
                </strong>

            </article>


            <article class="stat">

                <span>
                    Non lus
                </span>

                <strong id="messagesNonLus">
                    0
                </strong>

            </article>


            <article class="stat">

                <span>
                    Lus
                </span>

                <strong id="messagesLus">
                    0
                </strong>

            </article>

        </section>


        <section class="outils">

            <input
                type="search"
                id="recherche"
                placeholder="Rechercher un nom, e-mail, sujet ou message..."
            >

            <select id="filtre">

                <option value="tous">
                    Tous les messages
                </option>

                <option value="non-lus">
                    Messages non lus
                </option>

                <option value="lus">
                    Messages lus
                </option>

            </select>

            <button
                class="actualiser"
                onclick="chargerMessages()"
            >
                Actualiser
            </button>

        </section>


        <section
            id="listeMessages"
            class="liste"
        >

            <div class="chargement">
                Chargement des messages...
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const EMAIL_ADMIN =
            "diawlalromantique@gmail.com";

        let tousLesMessages = [];


        function protegerTexte(texte) {
            const element =
                document.createElement("div");

            element.textContent =
                texte || "";

            return element.innerHTML;
        }


        async function verifierAdministrateur() {
            const {
                data,
                error
            } =
                await window
                    .diawlalSupabase
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {
                window.location.href =
                    "connexion.html";

                return false;
            }


            const emailUtilisateur =
                data.session.user.email;


            if (
                emailUtilisateur
                !== EMAIL_ADMIN
            ) {
                alert(
                    "Accès réservé à l’administrateur."
                );

                window.location.href =
                    "dashboard.html";

                return false;
            }


            return true;
        }


        function actualiserStatistiques() {
            const total =
                tousLesMessages.length;

            const nonLus =
                tousLesMessages.filter(
                    function (message) {
                        return message.lu !== true;
                    }
                ).length;

            const lus =
                total - nonLus;


            document
                .getElementById("totalMessages")
                .textContent =
                total;

            document
                .getElementById("messagesNonLus")
                .textContent =
                nonLus;

            document
                .getElementById("messagesLus")
                .textContent =
                lus;
        }


        async function chargerMessages() {
            const liste =
                document.getElementById(
                    "listeMessages"
                );


            liste.innerHTML =
                `
                <div class="chargement">
                    Chargement des messages...
                </div>
                `;


            const {
                data,
                error
            } =
                await window
                    .diawlalSupabase
                    .from("messages_contact")
                    .select(
                        "id, nom, email, sujet, message, lu, created_at"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {
                liste.innerHTML =
                    `
                    <div class="erreur">
                        Erreur :
                        ${protegerTexte(error.message)}
                    </div>
                    `;

                return;
            }


            tousLesMessages =
                data || [];


            actualiserStatistiques();
            filtrerMessages();
        }


        function filtrerMessages() {
            const recherche =
                document
                    .getElementById("recherche")
                    .value
                    .trim()
                    .toLowerCase();

            const filtre =
                document
                    .getElementById("filtre")
                    .value;


            const messagesFiltres =
                tousLesMessages.filter(
                    function (message) {
                        const correspondRecherche =
                            (
                                message.nom
                                + " "
                                + message.email
                                + " "
                                + message.sujet
                                + " "
                                + message.message
                            )
                            .toLowerCase()
                            .includes(recherche);


                        let correspondFiltre = true;


                        if (
                            filtre === "non-lus"
                        ) {
                            correspondFiltre =
                                message.lu !== true;
                        }


                        if (
                            filtre === "lus"
                        ) {
                            correspondFiltre =
                                message.lu === true;
                        }


                        return (
                            correspondRecherche
                            &&
                            correspondFiltre
                        );
                    }
                );


            afficherMessages(
                messagesFiltres
            );
        }


        function afficherMessages(messages) {
            const liste =
                document.getElementById(
                    "listeMessages"
                );


            if (
                messages.length === 0
            ) {
                liste.innerHTML =
                    `
                    <div class="vide">
                        Aucun message trouvé.
                    </div>
                    `;

                return;
            }


            liste.innerHTML = "";


            messages.forEach(
                function (message) {
                    const date =
                        new Date(
                            message.created_at
                        )
                        .toLocaleString(
                            "fr-FR"
                        );


                    const estLu =
                        message.lu === true;


                    const article =
                        document.createElement(
                            "article"
                        );


                    article.className =
                        "message "
                        + (
                            estLu
                            ? "lu"
                            : "non-lu"
                        );


                    const sujetEmail =
                        encodeURIComponent(
                            "Réponse DIAWLAL : "
                            + message.sujet
                        );


                    const corpsEmail =
                        encodeURIComponent(
                            "Bonjour "
                            + message.nom
                            + ",\n\n"
                            + "Merci pour votre message concernant : "
                            + message.sujet
                            + ".\n\n"
                        );


                    article.innerHTML =
                        `
                        <div class="message-header">

                            <div>

                                <h2>
                                    ${protegerTexte(message.nom)}
                                </h2>

                                <div class="email">
                                    ${protegerTexte(message.email)}
                                </div>

                                <span
                                    class="badge ${
                                        estLu
                                        ? "badge-lu"
                                        : "badge-non-lu"
                                    }"
                                >
                                    ${
                                        estLu
                                        ? "Lu"
                                        : "Nouveau"
                                    }
                                </span>

                            </div>

                            <div class="date">
                                ${protegerTexte(date)}
                            </div>

                        </div>

                        <div class="sujet">
                            Sujet :
                            ${protegerTexte(message.sujet)}
                        </div>

                        <div class="contenu">
                            ${protegerTexte(message.message)}
                        </div>

                        <div class="actions">

                            <button
                                class="bouton bouton-lire"
                                onclick="basculerLecture(
                                    '${message.id}',
                                    ${estLu}
                                )"
                            >
                                ${
                                    estLu
                                    ? "Marquer non lu"
                                    : "Marquer comme lu"
                                }
                            </button>

                            <a
                                class="bouton bouton-repondre"
                                href="mailto:${protegerTexte(message.email)}?subject=${sujetEmail}&body=${corpsEmail}"
                            >
                                Répondre
                            </a>

                            <button
                                class="bouton bouton-supprimer"
                                onclick="supprimerMessage(
                                    '${message.id}'
                                )"
                            >
                                Supprimer
                            </button>

                        </div>
                        `;


                    liste.appendChild(
                        article
                    );
                }
            );
        }


        async function basculerLecture(
            idMessage,
            estActuellementLu
        ) {
            const {
                error
            } =
                await window
                    .diawlalSupabase
                    .from("messages_contact")
                    .update({
                        lu:
                            !estActuellementLu
                    })
                    .eq(
                        "id",
                        idMessage
                    );


            if (error) {
                alert(
                    "Erreur : "
                    + error.message
                );

                return;
            }


            await chargerMessages();
        }


        async function supprimerMessage(
            idMessage
        ) {
            const confirmation =
                confirm(
                    "Supprimer définitivement ce message ?"
                );


            if (!confirmation) {
                return;
            }


            const {
                error
            } =
                await window
                    .diawlalSupabase
                    .from("messages_contact")
                    .delete()
                    .eq(
                        "id",
                        idMessage
                    );


            if (error) {
                alert(
                    "Erreur : "
                    + error.message
                );

                return;
            }


            await chargerMessages();
        }


        async function seDeconnecter() {
            await window
                .diawlalSupabase
                .auth
                .signOut();


            window.location.href =
                "connexion.html";
        }


        document
            .getElementById("recherche")
            .addEventListener(
                "input",
                filtrerMessages
            );


        document
            .getElementById("filtre")
            .addEventListener(
                "change",
                filtrerMessages
            );


        async function demarrer() {
            const adminValide =
                await verifierAdministrateur();


            if (!adminValide) {
                return;
            }


            await chargerMessages();
        }


        demarrer();
    </script>

</body>

</html>
