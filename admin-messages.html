<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administration - DIAWLAL</title>

    <style>
        :root {
            --or: #d4af37;
            --or-clair: #f4d76b;
            --or-fonce: #9d7515;
            --gris: #b8b8b8;
            --bordure: rgba(212,175,55,0.45);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(212,175,55,0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080808,
                    #111111,
                    #181818
                );
        }

        nav {
            width: min(1200px,94%);
            margin: auto;
            padding: 22px 10px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            border-bottom:
                1px solid rgba(212,175,55,0.18);
        }

        .logo {
            color: var(--or);

            font-size: 29px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        .menu {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
        }

        .menu a,
        .deconnexion {
            padding: 10px 12px;

            color: white;
            background: transparent;

            border: none;
            border-radius: 9px;

            text-decoration: none;
            font-weight: 700;

            cursor: pointer;
        }

        .container {
            width: min(1100px,92%);
            margin: auto;
            padding: 50px 0 80px;
        }

        .entete {
            margin-bottom: 30px;
            text-align: center;
        }

        .entete h1 {
            margin-bottom: 12px;

            font-size: clamp(36px,6vw,58px);
        }

        .entete p {
            color: var(--gris);
        }

        .statistiques {
            display: grid;
            grid-template-columns:
                repeat(3,1fr);

            gap: 16px;
            margin-bottom: 24px;
        }

        .stat {
            padding: 22px;

            text-align: center;

            background: #151515;

            border:
                1px solid var(--bordure);

            border-radius: 16px;
        }

        .stat span {
            display: block;

            margin-bottom: 8px;

            color: var(--gris);
        }

        .stat strong {
            color: var(--or-clair);
            font-size: 29px;
        }

        .outils {
            margin-bottom: 25px;
            padding: 20px;

            display: grid;
            grid-template-columns:
                1fr 220px auto;

            gap: 12px;

            background: #151515;

            border:
                1px solid var(--bordure);

            border-radius: 16px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;

            color: white;
            background: #0d0d0d;

            border:
                1px solid rgba(212,175,55,0.35);

            border-radius: 10px;
        }

        .actualiser {
            padding: 13px 18px;

            color: #111;

            background:
                linear-gradient(
                    135deg,
                    var(--or-clair),
                    var(--or)
                );

            border: none;
            border-radius: 10px;

            font-weight: 900;
            cursor: pointer;
        }

        .liste {
            display: grid;
            gap: 18px;
        }

        .message {
            padding: 24px;

            background: #151515;

            border:
                1px solid var(--bordure);

            border-radius: 18px;
        }

        .message.non-lu {
            border-color: var(--or-clair);
        }

        .message.lu {
            opacity: 0.75;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            margin-bottom: 15px;
        }

        .message h2 {
            margin-bottom: 5px;

            color: var(--or-clair);
        }

        .email,
        .date {
            color: var(--gris);
            font-size: 14px;
        }

        .badge {
            display: inline-block;

            margin-top: 9px;
            padding: 5px 9px;

            border-radius: 999px;

            font-size: 12px;
            font-weight: 900;
        }

        .badge-non-lu {
            color: #111;
            background: var(--or-clair);
        }

        .badge-lu {
            color: #bbf7d0;
            background: rgba(34,197,94,0.18);
        }

        .sujet {
            margin-bottom: 12px;
            font-weight: 900;
        }

        .contenu {
            margin-bottom: 20px;

            color: #dedede;
            line-height: 1.7;

            white-space: pre-wrap;
        }

        .actions {
            display: grid;
            grid-template-columns:
                repeat(3,1fr);

            gap: 10px;
        }

        .bouton {
            padding: 12px;

            border: none;
            border-radius: 9px;

            text-align: center;
            text-decoration: none;

            font-weight: 900;
            cursor: pointer;
        }

        .bouton-lire {
            color: #111;
            background: var(--or);
        }

        .bouton-repondre {
            color: white;
            background: #166534;
        }

        .bouton-supprimer {
            color: white;
            background: #991b1b;
        }

        .chargement,
        .vide,
        .erreur {
            padding: 30px;

            text-align: center;
            color: var(--gris);

            border:
                1px dashed var(--bordure);

            border-radius: 15px;
        }

        @media(max-width:800px) {
            nav {
                flex-direction: column;
            }

            .statistiques,
            .actions,
            .outils {
                grid-template-columns: 1fr;
            }

            .message-header {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            DIAWLAL ADMIN
        </div>

        <div class="menu">

            <a href="dashboard.html">
                Tableau de bord
            </a>

            <a href="parametres.html">
                Paramètres
            </a>

            <button
                class="deconnexion"
                onclick="seDeconnecter()"
            >
                Déconnexion
            </button>

        </div>

    </nav>


    <main class="container">

        <section class="entete">

            <h1>
                Messages reçus
            </h1>

            <p>
                Administration sécurisée DIAWLAL.
            </p>

        </section>


        <section class="statistiques">

            <article class="stat">

                <span>
                    Total
                </span>

                <strong id="totalMessages">
                    0
                </strong>

            </article>


            <article class="stat">

                <span>
                    Non lus
                </span>

                <strong id="messagesNonLus">
                    0
                </strong>

            </article>


            <article class="stat">

                <span>
                    Lus
                </span>

                <strong id="messagesLus">
                    0
                </strong>

            </article>

        </section>


        <section class="outils">

            <input
                type="search"
                id="recherche"
                placeholder="Rechercher..."
            >

            <select id="filtre">

                <option value="tous">
                    Tous
                </option>

                <option value="non-lus">
                    Non lus
                </option>

                <option value="lus">
                    Lus
                </option>

            </select>

            <button
                class="actualiser"
                onclick="chargerMessages()"
            >
                Actualiser
            </button>

        </section>


        <section
            id="listeMessages"
            class="liste"
        >

            <div class="chargement">
                Chargement...
            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        let tousLesMessages = [];


        function protegerTexte(texte) {
            const element =
                document.createElement("div");

            element.textContent =
                texte || "";

            return element.innerHTML;
        }


        async function verifierAdministrateur() {
            const {
                data: sessionData
            } =
                await window
                    .diawlalSupabase
                    .auth
                    .getSession();


            if (
                !sessionData.session
            ) {
                window.location.href =
                    "connexion.html";

                return false;
            }


            const {
                data: estAdmin,
                error
            } =
                await window
                    .diawlalSupabase
                    .rpc("est_admin");


            if (
                error ||
                estAdmin !== true
            ) {
                alert(
                    "Accès réservé à l’administrateur."
                );

                window.location.href =
                    "dashboard.html";

                return false;
            }


            return true;
        }


        function actualiserStatistiques() {
            const total =
                tousLesMessages.length;


            const nonLus =
                tousLesMessages.filter(
                    m => m.lu !== true
                ).length;


            document
                .getElementById(
                    "totalMessages"
                )
                .textContent =
                total;


            document
                .getElementById(
                    "messagesNonLus"
                )
                .textContent =
                nonLus;


            document
                .getElementById(
                    "messagesLus"
                )
                .textContent =
                total - nonLus;
        }


        async function chargerMessages() {
            const liste =
                document.getElementById(
                    "listeMessages"
                );


            liste.innerHTML =
                '<div class="chargement">Chargement...</div>';


            const {
                data,
                error
            } =
                await window
                    .diawlalSupabase
                    .from(
                        "messages_contact"
                    )
                    .select(
                        "id, nom, email, sujet, message, lu, created_at"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


            if (error) {
                liste.innerHTML =
                    '<div class="erreur">Erreur : '
                    + protegerTexte(
                        error.message
                    )
                    + '</div>';

                return;
            }


            tousLesMessages =
                data || [];


            actualiserStatistiques();
            filtrerMessages();
        }


        function filtrerMessages() {
            const recherche =
                document
                    .getElementById(
                        "recherche"
                    )
                    .value
                    .toLowerCase();


            const filtre =
                document
                    .getElementById(
                        "filtre"
                    )
                    .value;


            const resultat =
                tousLesMessages.filter(
                    function (message) {
                        const texte =
                            (
                                message.nom
                                + " "
                                + message.email
                                + " "
                                + message.sujet
                                + " "
                                + message.message
                            )
                            .toLowerCase();


                        let filtreValide = true;


                        if (
                            filtre ===
                            "non-lus"
                        ) {
                            filtreValide =
                                message.lu !== true;
                        }


                        if (
                            filtre ===
                            "lus"
                        ) {
                            filtreValide =
                                message.lu === true;
                        }


                        return (
                            texte.includes(
                                recherche
                            )
                            &&
                            filtreValide
                        );
                    }
                );


            afficherMessages(
                resultat
            );
        }


        function afficherMessages(messages) {
            const liste =
                document.getElementById(
                    "listeMessages"
                );


            if (
                messages.length === 0
            ) {
                liste.innerHTML =
                    '<div class="vide">Aucun message.</div>';

                return;
            }


            liste.innerHTML = "";


            messages.forEach(
                function (message) {
                    const estLu =
                        message.lu === true;


                    const date =
                        new Date(
                            message.created_at
                        )
                        .toLocaleString(
                            "fr-FR"
                        );


                    const gmail =
                        "https://mail.google.com/mail/?view=cm&fs=1"
                        + "&to="
                        + encodeURIComponent(
                            message.email
                        )
                        + "&su="
                        + encodeURIComponent(
                            "Réponse DIAWLAL : "
                            + message.sujet
                        )
                        + "&body="
                        + encodeURIComponent(
                            "Bonjour "
                            + message.nom
                            + ",\n\n"
                        );


                    const article =
                        document.createElement(
                            "article"
                        );


                    article.className =
                        "message "
                        + (
                            estLu
                            ? "lu"
                            : "non-lu"
                        );


                    article.innerHTML =
                        `
                        <div class="message-header">

                            <div>

                                <h2>
                                    ${protegerTexte(message.nom)}
                                </h2>

                                <div class="email">
                                    ${protegerTexte(message.email)}
                                </div>

                                <span class="badge ${
                                    estLu
                                    ? "badge-lu"
                                    : "badge-non-lu"
                                }">
                                    ${
                                        estLu
                                        ? "Lu"
                                        : "Nouveau"
                                    }
                                </span>

                            </div>

                            <div class="date">
                                ${protegerTexte(date)}
                            </div>

                        </div>

                        <div class="sujet">
                            Sujet :
                            ${protegerTexte(message.sujet)}
                        </div>

                        <div class="contenu">
                            ${protegerTexte(message.message)}
                        </div>

                        <div class="actions">

                            <button
                                class="bouton bouton-lire"
                                onclick="basculerLecture('${message.id}', ${estLu})"
                            >
                                ${
                                    estLu
                                    ? "Marquer non lu"
                                    : "Marquer comme lu"
                                }
                            </button>

                            <a
                                class="bouton bouton-repondre"
                                href="${gmail}"
                                target="_blank"
                            >
                                Répondre avec Gmail
                            </a>

                            <button
                                class="bouton bouton-supprimer"
                                onclick="supprimerMessage('${message.id}')"
                            >
                                Supprimer
                            </button>

                        </div>
                        `;


                    liste.appendChild(
                        article
                    );
                }
            );
        }


        async function basculerLecture(
            id,
            estLu
        ) {
            const {
                error
            } =
                await window
                    .diawlalSupabase
                    .from(
                        "messages_contact"
                    )
                    .update({
                        lu: !estLu
                    })
                    .eq(
                        "id",
                        id
                    );


            if (error) {
                alert(
                    error.message
                );

                return;
            }


            chargerMessages();
        }


        async function supprimerMessage(id) {
            if (
                !confirm(
                    "Supprimer ce message ?"
                )
            ) {
                return;
            }


            const {
                error
            } =
                await window
                    .diawlalSupabase
                    .from(
                        "messages_contact"
                    )
                    .delete()
                    .eq(
                        "id",
                        id
                    );


            if (error) {
                alert(
                    error.message
                );

                return;
            }


            chargerMessages();
        }


        async function seDeconnecter() {
            await window
                .diawlalSupabase
                .auth
                .signOut();

            window.location.href =
                "connexion.html";
        }


        document
            .getElementById(
                "recherche"
            )
            .addEventListener(
                "input",
                filtrerMessages
            );


        document
            .getElementById(
                "filtre"
            )
            .addEventListener(
                "change",
                filtrerMessages
            );


        async function demarrer() {
            const autorise =
                await verifierAdministrateur();


            if (!autorise) {
                return;
            }


            chargerMessages();
        }


        demarrer();
    </script>

</body>

</html>
