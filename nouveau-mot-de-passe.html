<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nouveau mot de passe - DIAWLAL</title>

    <style>
        :root {
            --or: #d4af37;
            --or-clair: #f4d76b;
            --or-fonce: #9d7515;
            --gris: #b8b8b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 30px 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(212, 175, 55, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #080808,
                    #111111,
                    #181818
                );
        }

        .carte {
            width: min(470px, 100%);
            padding: 35px;

            background:
                linear-gradient(
                    145deg,
                    #222222,
                    #101010
                );

            border:
                1px solid rgba(212, 175, 55, 0.48);

            border-radius: 22px;

            box-shadow:
                0 30px 70px rgba(0, 0, 0, 0.45);
        }

        .logo {
            margin-bottom: 25px;

            color: var(--or);

            text-align: center;
            font-size: 31px;
            font-weight: 900;
            letter-spacing: 3px;
        }

        h1 {
            margin-bottom: 10px;
            text-align: center;
            font-size: 32px;
        }

        .sous-titre {
            margin-bottom: 28px;

            color: var(--gris);
            text-align: center;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 16px 0 7px;

            color: var(--or-clair);
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;

            color: white;
            background: #0d0d0d;

            border:
                1px solid rgba(212, 175, 55, 0.35);

            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--or);

            box-shadow:
                0 0 0 3px rgba(212, 175, 55, 0.12);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 22px;

            color: #111111;

            background:
                linear-gradient(
                    135deg,
                    var(--or-clair),
                    var(--or),
                    var(--or-fonce)
                );

            border: none;
            border-radius: 10px;

            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .message {
            display: none;

            margin-top: 16px;
            padding: 13px;

            border-radius: 10px;

            text-align: center;
            line-height: 1.5;
        }

        .succes {
            display: block;

            color: #bbf7d0;
            background: rgba(34, 197, 94, 0.14);

            border:
                1px solid rgba(34, 197, 94, 0.45);
        }

        .erreur {
            display: block;

            color: #fecaca;
            background: rgba(239, 68, 68, 0.14);

            border:
                1px solid rgba(239, 68, 68, 0.45);
        }

        .retour {
            display: block;
            margin-top: 22px;

            color: var(--or-clair);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <main class="carte">

        <div class="logo">
            DIAWLAL
        </div>

        <h1>
            Nouveau mot de passe
        </h1>

        <p class="sous-titre">
            Choisissez un nouveau mot de passe sécurisé.
        </p>

        <form id="formMotDePasse">

            <label for="nouveauMotDePasse">
                Nouveau mot de passe
            </label>

            <input
                type="password"
                id="nouveauMotDePasse"
                minlength="6"
                required
            >

            <label for="confirmationMotDePasse">
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                id="confirmationMotDePasse"
                minlength="6"
                required
            >

            <button
                type="submit"
                id="boutonEnregistrer"
            >
                Enregistrer le nouveau mot de passe
            </button>

        </form>

        <div
            id="message"
            class="message"
        ></div>

        <a
            href="connexion.html"
            class="retour"
        >
            Retour à la connexion
        </a>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const formulaire =
            document.getElementById(
                "formMotDePasse"
            );

        const bouton =
            document.getElementById(
                "boutonEnregistrer"
            );

        const message =
            document.getElementById(
                "message"
            );


        function afficherMessage(
            texte,
            type
        ) {
            message.textContent = texte;
            message.className =
                "message " + type;
        }


        async function preparerSession() {
            const parametres =
                new URLSearchParams(
                    window.location.search
                );

            const code =
                parametres.get("code");


            if (code) {
                const {
                    error
                } =
                    await window
                        .diawlalSupabase
                        .auth
                        .exchangeCodeForSession(
                            code
                        );


                if (error) {
                    afficherMessage(
                        "Lien invalide ou expiré. Demande un nouveau lien.",
                        "erreur"
                    );

                    return false;
                }


                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );
            }


            const {
                data,
                error
            } =
                await window
                    .diawlalSupabase
                    .auth
                    .getSession();


            if (
                error ||
                !data.session
            ) {
                afficherMessage(
                    "Session de récupération absente. Demande un nouveau lien.",
                    "erreur"
                );

                return false;
            }


            return true;
        }


        formulaire.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();


                const sessionValide =
                    await preparerSession();


                if (!sessionValide) {
                    return;
                }


                const nouveauMotDePasse =
                    document
                        .getElementById(
                            "nouveauMotDePasse"
                        )
                        .value;


                const confirmation =
                    document
                        .getElementById(
                            "confirmationMotDePasse"
                        )
                        .value;


                if (
                    nouveauMotDePasse.length < 6
                ) {
                    afficherMessage(
                        "Le mot de passe doit contenir au moins 6 caractères.",
                        "erreur"
                    );

                    return;
                }


                if (
                    nouveauMotDePasse
                    !== confirmation
                ) {
                    afficherMessage(
                        "Les deux mots de passe ne correspondent pas.",
                        "erreur"
                    );

                    return;
                }


                bouton.disabled = true;

                bouton.textContent =
                    "Enregistrement...";


                const {
                    error
                } =
                    await window
                        .diawlalSupabase
                        .auth
                        .updateUser({
                            password:
                                nouveauMotDePasse
                        });


                bouton.disabled = false;

                bouton.textContent =
                    "Enregistrer le nouveau mot de passe";


                if (error) {
                    afficherMessage(
                        "Erreur : "
                        + error.message,
                        "erreur"
                    );

                    return;
                }


                afficherMessage(
                    "Mot de passe modifié avec succès.",
                    "succes"
                );


                setTimeout(
                    function () {
                        window.location.href =
                            "connexion.html";
                    },
                    1200
                );
            }
        );


        preparerSession();
    </script>

</body>

</html>
